<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acceso Privado</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="Debes tener la llave." />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <style id="lock-screen-style">
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100vh; font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; background: radial-gradient(circle at top, #1e293b 0%, #0b1120 65%); color: #f8fafc; }
    .lock-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .lock-card { width: 100%; max-width: 460px; background: #111827; border: 1px solid #263248; border-radius: 16px; padding: 28px 24px 24px; box-shadow: 0 24px 60px rgba(0,0,0,.55); text-align: center; }
    .lock-badge { width: 56px; height: 56px; margin: 0 auto 14px; border-radius: 14px; background: linear-gradient(135deg, #0057b8, #2563eb); display: flex; align-items: center; justify-content: center; color: #fff; box-shadow: 0 10px 24px rgba(37,99,235,.35); }
    .lock-card h1 { margin: 0 0 8px; font-size: 20px; font-weight: 700; }
    .lock-sub { margin: 0 0 20px; font-size: 13.2px; color: #94a3b8; line-height: 1.5; }
    .drop-zone { border: 2px dashed #334155; border-radius: 12px; padding: 24px 16px; background: #0f172a; cursor: pointer; transition: border-color .16s, background .16s; }
    .drop-zone:hover, .drop-zone.dragover { border-color: #3b82f6; background: rgba(37,99,235,.12); }
    .drop-icon { width: 34px; height: 34px; margin: 0 auto 10px; color: #60a5fa; }
    .drop-title { font-size: 14px; font-weight: 700; color: #f1f5f9; margin-bottom: 4px; }
    .drop-hint { font-size: 12px; color: #94a3b8; }
    .lock-btn { margin-top: 14px; width: 100%; border: none; border-radius: 10px; padding: 11px 16px; font-size: 13.5px; font-weight: 700; font-family: inherit; background: #2563eb; color: #fff; cursor: pointer; transition: background .15s; }
    .lock-btn:hover { background: #1d4ed8; }
    .lock-error { display: none; margin-top: 14px; padding: 10px 12px; border-radius: 9px; background: rgba(220,38,38,.16); border: 1px solid rgba(248,113,113,.4); color: #fca5a5; font-size: 12.5px; line-height: 1.45; text-align: left; }
    .lock-error.show { display: block; }
    .lock-foot { margin-top: 18px; padding-top: 14px; border-top: 1px solid #1e293b; font-size: 11.5px; color: #64748b; line-height: 1.5; }
    .lock-status { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 6px; color: #94a3b8; font-weight: 600; }
    .lock-dot { width: 7px; height: 7px; border-radius: 50%; background: #22c55e; display: inline-block; }
  </style>
</head>
<body>
  <div id="lockScreen" class="lock-wrap" style="display:none;">
    <div class="lock-card">
      <div class="lock-badge" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
      <h1>Acceso Privado</h1>
      <p class="lock-sub">Esta herramienta está protegida.</p>
      <div id="dropZone" class="drop-zone" role="button" tabindex="0">
        <svg class="drop-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">
          <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/>
        </svg>
        <div class="drop-title">Arrastra aquí la llave (.g09key)</div>
        <div class="drop-hint">o haz clic para seleccionarlo desde tu equipo</div>
      </div>
      <input type="file" id="vaultKeyInput" accept=".g09key,.json,application/json" style="display:none;" />
      <button type="button" id="btnPickKey" class="lock-btn">Cargar llave :)</button>
      <div id="lockError" class="lock-error"></div>
      <div class="lock-foot">
        <div class="lock-status">
          <span class="lock-dot"></span>
          <span id="lockCacheStatus">100% local · Cifrado en el navegador</span>
        </div>
        <div>Solo se solicita la primera vez en este PC. Después funcionará directo e incluso sin internet.</div>
      </div>
    </div>
  </div>
  <div id="appMount"></div>
  <script src="./vault.js"></script>
  <script src="./core.js"></script>
</body>
</html>
